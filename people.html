<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SEED Lab | People</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --accent: #003366;
      --text: #2d2d2d;
      --muted: #555;
      --border: #e5e7eb;
      --bg-light: #f9fafb;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--text);
      background-color: white;
      line-height: 1.65;
    }

    /* ---------- Header ---------- */
    header {
      padding: 42px 0 28px;
      border-bottom: 1px solid var(--border);
    }

    .logo-title {
      width: 90%;
      max-width: 1100px;
      margin: auto;
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .lab-logo {
      height: 140px;
      width: auto;
    }

    header h1 {
      margin: 0;
      font-size: 2.2rem;
      color: var(--accent);
      letter-spacing: 0.3px;
    }

    header p {
      margin-top: 6px;
      font-size: 1.2rem;
      color: #555;
      line-height: 1.4;
    }

    .lab-subtitle .first-letter {
      font-weight: bold;
      text-decoration: underline;
    }

    /* ---------- Navigation ---------- */
    nav {
      border-bottom: 1px solid var(--border);
    }

    nav ul {
      list-style: none;
      margin: 0 auto;
      padding: 0;
      width: 90%;
      max-width: 1100px;
      display: flex;
      gap: 4px;
    }

    nav a {
      display: block;
      padding: 14px 16px;
      text-decoration: none;
      color: var(--accent);
      font-weight: 500;
      font-size: 0.95rem;
    }

    nav a:hover {
      background-color: var(--bg-light);
    }

    /* ---------- Layout ---------- */
    .container {
      width: 90%;
      max-width: 1100px;
      margin: 0 auto;
    }

    section {
      padding: 24px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    section:last-child {
      border-bottom: none;
    }

    h2 {
      margin-top: 0;
      font-size: 1.6rem;
      color: var(--accent);
    }

    .lead {
      font-size: 1.05rem;
      line-height: 1.6;
      text-align: justify;
    }

    /* ---------- Members Grid ---------- */
    .members-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 32px;
      justify-content: center;
      margin-top: 24px;
    }

    .member-card {
      width: 200px;
      text-align: center;
    }

    .member-photo {
      width: 170px;
      height: 170px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--border);
      margin-bottom: 12px;
    }

    /* ---------- Footer ---------- */
    footer {
      border-top: 1px solid var(--border);
      padding: 32px 0;
      font-size: 0.9rem;
      color: var(--muted);
    }

    /* ---------- Responsive ---------- */
    @media (max-width: 768px) {
      .members-grid {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-R0E1EVT00L"></script>

  gtag('js', new Date());

  gtag('config', 'G-R0E1EVT00L');
</script>
</head>

<body>

<header>
  <div class="logo-title">
    <img src="./images/seed-logo.png" alt="SEED Lab Logo" class="lab-logo">
    <div>
      <h1>SEED Lab</h1>
      <p class="lab-subtitle">
        <span class="first-letter">S</span>oil 
        <span class="first-letter">E</span>cology 
        and 
        <span class="first-letter">E</span>nvironmental 
        <span class="first-letter">D</span>ynamics Lab
      </p>
      <p>at the University of Hong Kong</p>
    </div>
  </div>
</header>

<nav>
  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="people.html">People</a></li>
    <li><a href="join.html">Join Us</a></li>
  </ul>
</nav>

<section>
  <div class="container">
    <p class="lead">
      Our lab is expanding. Members’ profiles will appear here soon.
    </p>

</section>

<footer>
  <div class="container">
    <p>
      © 2026 SEED Lab | School of Biological Sciences, The University of Hong Kong
    </p>
  </div>
</footer>
